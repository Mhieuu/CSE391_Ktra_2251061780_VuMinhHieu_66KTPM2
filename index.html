<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>

    <!-- Bootstrap offline -->
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ====== NAVBAR ====== -->
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="bi bi-kanban fs-4"></i>
                Task Manager
            </a>
            <button class="btn btn-add-task" data-bs-toggle="modal" data-bs-target="#taskModal" id="btnOpenAdd">
                <i class="bi bi-plus-lg"></i> New Task
            </button>
        </div>
    </nav>

    <!-- ====== MAIN CONTENT ====== -->
    <div class="container py-4">

        <!-- Task Table -->
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold">
                    <i class="bi bi-clipboard-check me-1"></i> Task List
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="text-center" style="width:50px">#</th>
                                <th>Task Name</th>
                                <th style="width:120px">Priority</th>
                                <th style="width:130px">Status</th>
                                <th style="width:80px" class="text-center">Progress</th>
                                <th style="width:120px" class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody">
                            <!-- Tasks render here -->
                        </tbody>
                    </table>
                </div>
                <!-- Empty state -->
                <div class="text-center py-5" id="emptyState" style="display:none">
                    <i class="bi bi-inbox fs-1 text-secondary"></i>
                    <p class="text-muted mt-2 mb-0">No tasks found</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ====== MODAL: Add / Edit Task ====== -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">
                        <i class="bi bi-plus-circle me-1"></i> Add Task
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <form id="taskForm">
                    <!-- Hidden input lưu id khi sửa -->
                    <input type="hidden" id="taskId">

                    <div class="modal-body">
                        <!-- Task Name -->
                        <div class="mb-3">
                            <label for="taskName" class="form-label">Task Name <span class="text-danger">*</span></label>
                            <input
                                type="text"
                                class="form-control"
                                id="taskName"
                                placeholder="Type your task here..."
                                maxlength="150"
                                autocomplete="off"
                            >
                            <div id="errorMessage" class="error-message"></div>
                            <div class="form-text">
                                <span id="charCount">0</span> / 100 characters
                            </div>
                        </div>

                        <!-- Priority -->
                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <div class="d-flex gap-2 flex-wrap">
                                <button type="button" class="btn btn-priority btn-priority-high" data-priority="High">
                                    <i class="bi bi-chevron-up"></i> High
                                </button>
                                <button type="button" class="btn btn-priority btn-priority-medium" data-priority="Medium">
                                    <i class="bi bi-dash"></i> Medium
                                </button>
                                <button type="button" class="btn btn-priority btn-priority-low active-low" data-priority="Low">
                                    <i class="bi bi-chevron-down"></i> Low
                                </button>
                            </div>
                            <input type="hidden" id="selectedPriority" value="Low">
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="selectedStatus">
                                <option value="To Do">To Do</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-submit-add" id="btnSubmitTask">
                            <i class="bi bi-plus-lg"></i> Add Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ====== MODAL: Confirm Delete ====== -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-exclamation-triangle text-danger me-1"></i> Confirm Delete
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0" id="deleteConfirmMessage">Are you sure you want to delete this task?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="btnConfirmDelete">
                        <i class="bi bi-trash me-1"></i> Delete
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== TOAST CONTAINER ====== -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Bootstrap JS offline -->
    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <!-- CRUD + Validation -->
    <script src="js/script.js"></script>
</body>
</html>
